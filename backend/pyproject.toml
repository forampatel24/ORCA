[project]
name = "orca-backend"
version = "0.1.0"
description = "ORCA Marine Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.27",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "qdrant-client>=1.9.0",
    "minio>=7.2.5",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "openai>=1.30.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "geopandas>=0.14.3",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "rasterio>=1.3.10",
    "xarray>=2024.3.0",
    "netcdf4>=1.6.5",
    "rioxarray>=0.15.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "fastembed>=0.3.0",
    "pypdf>=4.1.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "black>=24.3.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
