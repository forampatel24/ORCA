services:
  redis:
    image: redis:7-alpine
    container_name: orca-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orca-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.5
    container_name: orca-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - orca-network
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  minio:
    image: minio/minio:latest
    container_name: orca-minio
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    networks:
      - orca-network
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Optional: postgres as container (if you prefer not using native D:\PostreSQL)
  # Comment out if using native PostgreSQL on port 5432
  # postgres:
  #   image: postgis/postgis:16-3.4-alpine
  #   container_name: orca-postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-postgres}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
  #     - POSTGRES_DB=${POSTGRES_DB:-orca_db}
  #   networks:
  #     - orca-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
  #     interval: 10s
  #     retries: 5

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  orca-network:
    driver: bridge
